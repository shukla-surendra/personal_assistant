{{- if .Values.backend.workloadIdentityClientId }}
# Tells the Secrets Store CSI Driver (installed as AKS's own
# key_vault_secrets_provider addon, see terraform/aks-infra/main.tf) which
# vault + secret to fetch, and which Workload Identity to fetch it as.
# secretObjects below additionally syncs the fetched value into a real K8s
# Secret -- so the backend Deployment can keep reading OPENAI_API_KEY via
# a normal secretKeyRef, unaware Key Vault is even involved.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "pa.fullname" . }}-openai
  labels:
    {{- include "pa.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.backend.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: openai-api-key
          objectType: secret
  secretObjects:
    - secretName: {{ include "pa.fullname" . }}-openai-secret
      type: Opaque
      data:
        - objectName: openai-api-key
          key: OPENAI_API_KEY
{{- end }}
