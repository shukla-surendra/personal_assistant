# The backend pod's own identity, distinct from "default". Azure AD's
# federated_identity_credential (terraform/keyvault) trusts THIS exact
# namespace+name pair as a specific Azure identity -- a pod running under
# any other ServiceAccount gets no Key Vault access at all, by construction,
# not by convention.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pa.fullname" . }}-backend
  labels:
    {{- include "pa.labels" . | nindent 4 }}
  {{- if .Values.backend.workloadIdentityClientId }}
  annotations:
    # This is what the Azure Workload Identity webhook reads to know which
    # Azure AD app registration a token minted for this ServiceAccount
    # should be exchanged for.
    azure.workload.identity/client-id: {{ .Values.backend.workloadIdentityClientId | quote }}
  {{- end }}
