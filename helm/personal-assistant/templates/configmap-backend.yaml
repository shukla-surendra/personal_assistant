apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pa.fullname" . }}-backend-config
  labels:
    {{- include "pa.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.backend.env.environment | quote }}
  STORAGE_TYPE: {{ .Values.backend.env.storageType | quote }}
  AUTH_TYPE: {{ .Values.backend.env.authType | quote }}
  ALLOWED_ORIGINS: {{ .Values.backend.env.allowedOrigins | quote }}
  OPENAI_MODEL: {{ .Values.backend.env.openaiModel | quote }}
  AZURE_STORAGE_ACCOUNT_URL: {{ .Values.backend.env.azureStorageAccountUrl | quote }}
  AZURE_STORAGE_CONTAINER: {{ .Values.backend.env.azureStorageContainer | quote }}
  AZURE_STORAGE_QUEUE_URL: {{ .Values.backend.env.azureStorageQueueUrl | quote }}
  AZURE_STORAGE_QUEUE_NAME: {{ .Values.queue.name | quote }}
  AZURE_STORAGE_QUEUE_POISON_NAME: {{ .Values.queue.poisonName | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.backend.env.otelExporterOtlpEndpoint | quote }}
  OTEL_SERVICE_NAME: {{ include "pa.fullname" . }}-backend
  DB_HOST: {{ include "pa.fullname" . }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  REDIS_URL: redis://{{ include "pa.fullname" . }}-redis:6379/0
